<!doctype html>
<html lang="de" data-theme="marine">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hörbuch</title>
<meta name="theme-color" content="#12336b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hörbuch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* ---------- Farbthemen ---------- */
:root{--g1:#1d4a94;--g2:#0c1f47;--g3:#050c22;--acc:#7cc0ff;
  --text:#fff;--dim:rgba(255,255,255,.68);--faint:rgba(255,255,255,.42);
  --glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.17);--line:rgba(255,255,255,.13);--danger:#ff5d64}
html[data-theme=abendrot]{--g1:#f07a2e;--g2:#b8264a;--g3:#3d0a24;--acc:#ffd36e}
html[data-theme=violett]{--g1:#d93c8f;--g2:#6a2bd9;--g3:#1d0b45;--acc:#ffb8ea}
html[data-theme=wald]{--g1:#25a571;--g2:#0e5b45;--g3:#03231b;--acc:#8ff5c8}
html[data-theme=petrol]{--g1:#1ab0c2;--g2:#11607e;--g3:#05253a;--acc:#a6f4ff}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--g3);color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#bg{position:fixed;inset:0;z-index:-1;
  background:radial-gradient(130% 70% at 15% -5%,var(--g1) 0%,transparent 65%),
             linear-gradient(170deg,var(--g1) 0%,var(--g2) 50%,var(--g3) 100%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.view{height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 12px)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:44px;flex:none}
.link{color:var(--text);padding:10px 8px 10px 0;font-size:17px;display:flex;align-items:center;gap:6px}
.link svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.link.acc{color:var(--acc)}
.roundbtn{width:40px;height:40px;border-radius:50%;background:var(--glass);display:flex;align-items:center;justify-content:center;font-weight:700}
h1{font-size:30px;margin:4px 0 14px;letter-spacing:-.3px}
.pill{border-radius:999px;padding:12px 18px;min-height:48px;background:var(--glass);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.pill:active{background:var(--glass2)}
.pill.primary{background:#fff;color:var(--g2)}
.pill.primary:active{opacity:.85}
.pill.danger{background:var(--danger);color:#fff}
.wide{width:100%}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:14px -16px 0;padding:0 16px 8px}
.banner{background:rgba(255,255,255,.12);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px;margin-bottom:12px}
.empty{color:var(--dim);text-align:center;padding:30px 10px}

/* ---------- Titelbild / Kachel ---------- */
.cov{flex:none;border-radius:12px;overflow:hidden;position:relative;background:var(--glass)}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.tile{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative;color:#fff;
  background:linear-gradient(140deg,var(--acc) -30%,var(--g1) 35%,var(--g2) 80%,var(--g3) 130%)}
.tile svg{position:absolute;right:8%;top:8%;width:34%;height:34%;fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.6;stroke-linecap:round}
.pcover{container-type:size}
.tile .tname{position:absolute;left:0;right:0;bottom:0;padding:9%;font-weight:800;font-size:12cqw;line-height:1.1;letter-spacing:-.3px;
  word-break:normal;overflow-wrap:normal;-webkit-hyphens:auto;hyphens:auto;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.tile .tinit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px}

/* ---------- Bibliothek ---------- */
.book{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:8px;margin-bottom:6px;border-radius:16px}
.book:active{background:var(--glass)}
.book.cur{background:var(--glass)}
.book .cov{width:60px;height:60px}
.binfo{flex:1;min-width:0}
.binfo b{display:block;font-size:17px;font-weight:600;word-break:break-word}
.binfo span{color:var(--dim);font-size:14px}
.mini{flex:none;display:flex;align-items:center;gap:12px;margin:6px -6px 0;padding:8px 8px 10px 8px;border-radius:18px;
  background:rgba(255,255,255,.14);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.mini .cov{width:48px;height:48px;border-radius:10px}
.mini .tile .tinit{font-size:20px}
.mtext{flex:1;min-width:0}
.mtext b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtext span{display:block;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mplay{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.mplay:active{background:var(--glass2)}
.mplay svg{width:30px;height:30px;fill:#fff}
.mprog{position:absolute;left:14px;right:14px;bottom:4px;height:3px;border-radius:2px;background:rgba(255,255,255,.2)}
.mprog i{display:block;height:100%;width:0;border-radius:2px;background:var(--acc)}
.libfoot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px}
.themes{display:flex;gap:10px}
.dot{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.dot.on{box-shadow:0 0 0 2px var(--g3),0 0 0 4px #fff}
.dot[data-t=marine]{background:linear-gradient(140deg,#3d74d1,#0c1f47)}
.dot[data-t=abendrot]{background:linear-gradient(140deg,#f6913e,#b8264a)}
.dot[data-t=violett]{background:linear-gradient(140deg,#e0569f,#6a2bd9)}
.dot[data-t=wald]{background:linear-gradient(140deg,#35c286,#0e5b45)}
.dot[data-t=petrol]{background:linear-gradient(140deg,#2cc7d8,#11607e)}
.foot{color:var(--faint);font-size:12px;text-align:right}

/* ---------- Abspielen ---------- */
.pcoverwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 0 4px}
.pcover{--s:min(calc(100vw - 64px),calc(100dvh - 430px - env(safe-area-inset-top) - env(safe-area-inset-bottom)),360px);
  width:max(var(--s),150px);height:max(var(--s),150px);border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.pinfo{flex:none;padding:14px 4px 6px}
.ptitle{font-size:22px;font-weight:700;line-height:1.2;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.psub{color:var(--dim);margin-top:4px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstatus{color:var(--acc);font-size:15px;min-height:20px;margin-top:4px}
.pctl{flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;--pct:0%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(to right,#fff var(--pct),rgba(255,255,255,.25) var(--pct))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-6.5px;box-shadow:0 1px 6px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:#fff}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;margin-top:-2px}
.mainrow{display:flex;align-items:center;justify-content:center;gap:clamp(18px,8vw,40px);margin:10px 0 14px}
.ic{display:flex;align-items:center;justify-content:center;border-radius:50%}
.ic:active{background:var(--glass)}
.ic svg{fill:currentColor}
.ic.jump{width:76px;height:76px}
.ic.jump svg{width:58px;height:58px}
.ic.play{width:88px;height:88px;background:#fff;color:var(--g2);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.ic.play:active{background:#fff;opacity:.85}
.ic.play svg{width:42px;height:42px}
.subrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ic.small{width:48px;height:48px;color:var(--dim)}
.ic.small svg{width:26px;height:26px}
.subrow .pill{min-height:44px;padding:10px 16px;font-size:15px}
.subrow #bRate{min-width:66px}
.subrow #bList svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* ---------- Dateiliste ---------- */
.trow{display:flex;align-items:center;border-radius:14px;margin-bottom:4px}
.trow.cur{background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--acc)}
.tmain{flex:1;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 10px;min-width:0;border-radius:14px}
.tmain:active{background:var(--glass)}
.tnum{color:var(--faint);flex:0 0 28px;text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.trow.cur .tnum{color:var(--acc)}
.tname{flex:1;word-break:break-word}
.tedit{display:flex;flex:none;padding-right:2px}
.tedit button{width:40px;height:44px;font-size:19px;border-radius:10px}
.tedit button:active{background:var(--glass2)}
.tedit button:disabled{opacity:.22}
.tedit .del{color:var(--danger)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none;margin-top:10px}
.tools .pill{padding:10px 8px;font-size:15px;min-height:46px}

/* ---------- Dialoge ---------- */
#modal,#busy{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.mbox{background:linear-gradient(170deg,var(--g2),var(--g3));border:1px solid var(--line);border-radius:22px;padding:20px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mbox h2{font-size:20px;margin:0 0 10px}
.mbox p{margin:0 0 12px}
.mbox ol{padding-left:22px;margin:0 0 12px}
.mbox li{margin-bottom:6px}
.mbox input[type=text]{width:100%;font:inherit;color:var(--text);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:12px;
  -webkit-user-select:text;user-select:text;margin-bottom:14px}
.mbtns{display:flex;gap:10px}
.mbtns .pill{flex:1}
#busy .mbox{text-align:center}
#busyBar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;margin:14px 0 8px}
#busyFill{height:100%;width:0;background:#fff}
#busySub{color:var(--dim);font-size:14px;word-break:break-word}
#diag{position:fixed;left:0;right:0;top:env(safe-area-inset-top);margin:0;padding:6px 8px;background:rgba(0,0,0,.82);color:#7dff9a;
  font:10px/1.3 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:38vh;overflow:hidden;z-index:20;pointer-events:none}
</style>
</head>
<body>
<div id="bg"></div>

<section id="vLib" class="view">
  <div class="bar"><span></span><button id="bHelp" class="roundbtn" aria-label="Hilfe">?</button></div>
  <h1>Meine Hörbücher</h1>
  <div id="installBanner" class="banner" hidden>
    <b>Zuerst zum Home-Bildschirm hinzufügen:</b> unten auf das Teilen-Symbol tippen, dann „Zum Home-Bildschirm“.
    Danach die App von dort öffnen und erst dann Hörbücher laden.
  </div>
  <button id="bAdd" class="pill primary wide">+ Hörbuch hinzufügen</button>
  <div id="libList" class="scroll"></div>
  <div id="mini" class="mini" hidden>
    <div id="mCover" class="cov"></div>
    <div class="mtext"><b id="mTitle"></b><span id="mBook"></span></div>
    <button id="mPlay" class="mplay" aria-label="Abspielen"><svg viewBox="0 0 24 24"><path id="mIcon" d="M8 5v14l11-7z"/></svg></button>
    <div class="mprog"><i id="mProg"></i></div>
  </div>
  <div class="libfoot"><div id="themes" class="themes"></div><div id="libFoot" class="foot"></div></div>
</section>

<section id="vPlayer" class="view" hidden>
  <div class="bar"><button id="bBack" class="link"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>Hörbücher</button></div>
  <div class="pcoverwrap"><div id="pCover" class="cov pcover"></div></div>
  <div class="pinfo">
    <div id="pTitle" class="ptitle"></div>
    <div id="pSub" class="psub"></div>
    <div id="pStatus" class="pstatus"></div>
  </div>
  <div class="pctl">
    <input id="seek" type="range" min="0" max="1" value="0" step="1" aria-label="Position">
    <div class="times"><span id="tCur">0:00</span><span id="tRem">0:00</span></div>
    <div class="mainrow">
      <button id="bBack10" class="ic jump" aria-label="10 Sekunden zurück"><svg viewBox="0 0 48 48"><path d="M24 9.5A15.5 15.5 0 1 1 8.5 25" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M24 3v13l-8.5-6.5z"/><text x="24" y="30.5" text-anchor="middle" font-size="13" font-weight="700" font-family="-apple-system,Arial,sans-serif">10</text></svg></button>
      <button id="bPlay" class="ic play" aria-label="Abspielen"><svg viewBox="0 0 24 24"><path id="pIcon" d="M8 5v14l11-7z"/></svg></button>
      <button id="bFwd10" class="ic jump" aria-label="10 Sekunden vor"><svg viewBox="0 0 48 48"><g transform="translate(48 0) scale(-1 1)"><path d="M24 9.5A15.5 15.5 0 1 1 8.5 25" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M24 3v13l-8.5-6.5z"/></g><text x="24" y="30.5" text-anchor="middle" font-size="13" font-weight="700" font-family="-apple-system,Arial,sans-serif">10</text></svg></button>
    </div>
    <div class="subrow">
      <button id="bPrev" class="ic small" aria-label="Vorherige Datei"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
      <button id="bRate" class="pill" aria-label="Geschwindigkeit">1×</button>
      <button id="bList" class="pill"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Dateien</button>
      <button id="bNext" class="ic small" aria-label="Nächste Datei"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
  </div>
</section>

<section id="vTracks" class="view" hidden>
  <div class="bar"><button id="bTBack" class="link"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Zurück</button><button id="bEdit" class="link acc">Bearbeiten</button></div>
  <h1 id="tBook" style="font-size:24px;word-break:break-word"></h1>
  <div id="tList" class="scroll" style="margin-top:0"></div>
  <div id="tTools" class="tools" hidden>
    <button id="bSort" class="pill">Nach Namen sortieren</button>
    <button id="bAddFiles" class="pill">Dateien hinzufügen</button>
    <button id="bRename" class="pill">Umbenennen</button>
    <button id="bDelBook" class="pill danger">Hörbuch löschen</button>
  </div>
</section>

<div id="modal" hidden><div id="modalBox" class="mbox"></div></div>
<div id="busy" hidden><div class="mbox"><b id="busyTitle"></b><div id="busyBar"><div id="busyFill"></div></div><div id="busySub"></div></div></div>

<!-- bewusst ohne accept-Filter: Dateien aus pCloud wären damit auf dem iPhone ausgegraut -->
<input id="pick" type="file" multiple hidden>
<audio id="audio" preload="auto" playsinline></audio>

<script>
'use strict';
const $ = id => document.getElementById(id);
const audio = $('audio');
const natCmp = new Intl.Collator('de', { numeric: true, sensitivity: 'base' }).compare;
const EXT_MIME = { mp3: 'audio/mpeg', m4a: 'audio/mp4', m4b: 'audio/mp4', mp4: 'audio/mp4', aac: 'audio/aac',
  wav: 'audio/wav', flac: 'audio/flac', ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg' };
const RATES = [1, 1.2, 1.5, 1.75, 2, 0.8];
const THEMES = [['marine', 'Marineblau', '#1d4a94'], ['abendrot', 'Abendrot', '#f07a2e'], ['violett', 'Violett', '#d93c8f'],
  ['wald', 'Wald', '#25a571'], ['petrol', 'Petrol', '#1ab0c2']];
const ICON_PLAY = 'M8 5v14l11-7z', ICON_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';

/* ---------- kleine Helfer ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
/* Prüfanzeige: nur mit „?diagnose“ in der Adresse sichtbar; zeigt, was das iPhone über die Wiedergabe meldet */
const DIAG = /diagnose/.test(location.search);
const diagLines = [];
function diag(msg) {
  if (!DIAG) return;
  diagLines.push(new Date().toTimeString().slice(0, 8) + ' ' + msg);
  if (diagLines.length > 16) diagLines.shift();
  renderDiag();
}
function renderDiag() {
  if (!DIAG) return;
  let el = document.getElementById('diag');
  if (!el) { el = document.createElement('pre'); el.id = 'diag'; document.body.append(el); }
  const r = [];
  try { for (let i = 0; i < audio.seekable.length; i++) r.push(audio.seekable.start(i).toFixed(0) + '–' + audio.seekable.end(i).toFixed(0)); } catch (e) {}
  el.textContent = 'rs=' + audio.readyState + ' ns=' + audio.networkState + ' ct=' + (audio.currentTime || 0).toFixed(1) +
    ' d=' + (audio.duration || 0).toFixed(1) + ' seeking=' + audio.seeking + ' paused=' + audio.paused +
    '\nspringbar=' + (r.join(',') || 'nichts') + ' ziel=' + (P.pendingSeek == null ? '-' : P.pendingSeek.toFixed(1)) +
    ' versuche=' + P.seekTries + ' quelle=' + (P.srcMem ? 'kopie' : 'direkt') + ' sperre=' + P.blockSave + '\n' + diagLines.join('\n');
}
function svg(html) { const d = document.createElement('div'); d.innerHTML = html; return d.firstChild; }
function ext(name) { const m = /\.([a-z0-9]+)$/i.exec(name); return m ? m[1].toLowerCase() : ''; }
function stripExt(name) { return name.replace(/\.[a-z0-9]{2,5}$/i, ''); }
function isAudio(f) { return (f.type && f.type.startsWith('audio/')) || ext(f.name) in EXT_MIME; }
function fmt(s) {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
  return (hh ? hh + ':' + String(mm).padStart(2, '0') : mm) + ':' + String(ss).padStart(2, '0');
}
function fmtSize(b) { return b >= 1e9 ? (b / 1e9).toFixed(1).replace('.', ',') + ' GB' : Math.round(b / 1e6) + ' MB'; }
function guessName(files) {
  const names = files.map(f => stripExt(f.name));
  let p = names[0] || '';
  if (names.length > 1) {
    for (const n of names) { let i = 0; while (i < p.length && i < n.length && p[i] === n[i]) i++; p = p.slice(0, i); }
    p = p.replace(/[\s\-_.,(\[#0-9]+$/, '').replace(/[\s\-_.,]*(kapitel|teil|track|cd|folge|part|chapter)$/i, '').trim();
  }
  return p.length >= 3 ? p : 'Neues Hörbuch';
}

/* ---------- Farbthema ---------- */
let theme = 'marine';
try { theme = localStorage.getItem('theme') || 'marine'; } catch (e) {}
function applyTheme(t) {
  const th = THEMES.find(x => x[0] === t) || THEMES[0];
  theme = th[0];
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name=theme-color]').setAttribute('content', th[2]);
  try { localStorage.setItem('theme', theme); } catch (e) {}
  const box = $('themes');
  box.textContent = '';
  for (const [id, name] of THEMES) box.append(h('button', { class: 'dot' + (id === theme ? ' on' : ''), 'data-t': id,
    'aria-label': 'Farbthema ' + name, onclick: () => applyTheme(id) }));
}

/* ---------- Titelbild aus der MP3 lesen (ID3 „APIC“), sonst Kachel ---------- */
function unsync(a) {
  const out = new Uint8Array(a.length); let j = 0;
  for (let i = 0; i < a.length; i++) { out[j++] = a[i]; if (a[i] === 0xFF && a[i + 1] === 0) i++; }
  return out.subarray(0, j);
}
async function readCover(file) {
  try {
    const hd = new Uint8Array(await file.slice(0, 10).arrayBuffer());
    if (hd[0] !== 0x49 || hd[1] !== 0x44 || hd[2] !== 0x33) return null;
    const ver = hd[3], flags = hd[5];
    const size = (hd[6] & 127) << 21 | (hd[7] & 127) << 14 | (hd[8] & 127) << 7 | (hd[9] & 127);
    if (ver < 2 || ver > 4 || size > 30e6) return null;
    let b = new Uint8Array(await file.slice(10, 10 + size).arrayBuffer());
    if ((flags & 0x80) && ver < 4) b = unsync(b);
    let i = 0;
    if ((flags & 0x40) && ver > 2) i = ver === 4 ? ((b[0] & 127) << 21 | (b[1] & 127) << 14 | (b[2] & 127) << 7 | (b[3] & 127)) : ((b[0] << 24 | b[1] << 16 | b[2] << 8 | b[3]) >>> 0) + 4;
    const idLen = ver === 2 ? 3 : 4, hdr = ver === 2 ? 6 : 10;
    while (i + hdr <= b.length) {
      const id = String.fromCharCode(...b.subarray(i, i + idLen));
      if (!/^[A-Z0-9]+$/.test(id)) break;
      const len = ver === 2 ? (b[i + 3] << 16 | b[i + 4] << 8 | b[i + 5])
        : ver === 4 ? ((b[i + 4] & 127) << 21 | (b[i + 5] & 127) << 14 | (b[i + 6] & 127) << 7 | (b[i + 7] & 127))
        : ((b[i + 4] << 24 | b[i + 5] << 16 | b[i + 6] << 8 | b[i + 7]) >>> 0);
      const start = i + hdr, end = start + len;
      if (end > b.length) break;
      if (id === 'APIC' || id === 'PIC') {
        let f = b.subarray(start, end);
        if (ver === 4 && (b[i + 9] & 0x02)) f = unsync(f);
        if (ver === 4 && (b[i + 9] & 0x01)) f = f.subarray(4);
        const enc = f[0]; let p, mime;
        if (id === 'PIC') { mime = String.fromCharCode(f[1], f[2], f[3]).toLowerCase() === 'png' ? 'image/png' : 'image/jpeg'; p = 4; }
        else {
          const z = f.indexOf(0, 1); if (z < 0) return null;
          mime = String.fromCharCode(...f.subarray(1, z)).toLowerCase(); p = z + 1;
          if (!mime.includes('/')) mime = mime.includes('png') ? 'image/png' : 'image/jpeg';
        }
        p += 1;   // Bildart
        if (enc === 1 || enc === 2) { while (p + 1 < f.length && !(f[p] === 0 && f[p + 1] === 0)) p += 2; p += 2; }
        else { while (p < f.length && f[p] !== 0) p++; p++; }
        const data = f.subarray(p);
        if (data.length > 200) return new Blob([data], { type: mime });
      }
      i = end;
    }
  } catch (e) {}
  return null;
}
const coverUrls = new Map();
function coverUrl(book) {
  if (!book || !book.cover) return null;
  let u = coverUrls.get(book.id);
  if (!u) { u = URL.createObjectURL(book.cover); coverUrls.set(book.id, u); }
  return u;
}
function hueShift(name) { let x = 0; for (const c of name) x = (x * 31 + c.charCodeAt(0)) | 0; return (Math.abs(x) % 41) - 20; }
const HEADPHONES = '<svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><path d="M4 15a2 2 0 0 1 2-2h1v7H6a2 2 0 0 1-2-2zM20 15a2 2 0 0 0-2-2h-1v7h1a2 2 0 0 0 2-2z"/></svg>';
function fillCover(el, book, big) {
  el.textContent = '';
  const u = coverUrl(book);
  if (u) { el.append(h('img', { src: u, alt: '' })); return; }
  const tile = h('div', { class: 'tile', style: 'filter:hue-rotate(' + hueShift(book.name) + 'deg)' });
  if (big) tile.append(svg(HEADPHONES), h('div', { class: 'tname' }, book.name));
  else tile.append(h('div', { class: 'tinit' }, (book.name.trim()[0] || '?').toUpperCase()));
  el.append(tile);
}

/* ---------- Datenbank (IndexedDB): Bücher, Datei-Infos, Audiodateien ---------- */
let dbPromise;
function db() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open('hoerbuch', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('books', { keyPath: 'id', autoIncrement: true });
      d.createObjectStore('tracks', { keyPath: 'id', autoIncrement: true }).createIndex('bookId', 'bookId');
      d.createObjectStore('files');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function withTx(stores, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(stores, mode);
    let result;
    t.oncomplete = () => res(result);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('Abgebrochen'));
    fn(t, v => { result = v; });
  });
}
const dbGet = (store, key) => withTx([store], 'readonly', (t, set) => { t.objectStore(store).get(key).onsuccess = e => set(e.target.result); });
const dbAll = store => withTx([store], 'readonly', (t, set) => { t.objectStore(store).getAll().onsuccess = e => set(e.target.result); });
const dbPut = (store, val) => withTx([store], 'readwrite', (t, set) => { t.objectStore(store).put(val).onsuccess = e => set(e.target.result); });

function addTrack(book, file) {
  const e = ext(file.name);
  const type = EXT_MIME[e] || file.type || 'audio/mpeg';
  const blob = file.type === type ? file : file.slice(0, file.size, type);
  return withTx(['tracks', 'files', 'books'], 'readwrite', (t, set) => {
    const r = t.objectStore('tracks').add({ bookId: book.id, name: stripExt(file.name), size: file.size });
    r.onsuccess = () => {
      const id = r.result;
      t.objectStore('files').put(blob, id);
      t.objectStore('books').put(Object.assign({}, book, { order: book.order.concat(id) }));
      set(id);
    };
  }).then(id => { book.order.push(id); return id; });
}
function loadBookData(book) {
  return withTx(['tracks', 'files'], 'readonly', (t, set) => {
    const metas = new Map(), blobs = new Map();
    const ts = t.objectStore('tracks'), fs = t.objectStore('files');
    for (const id of book.order) {
      ts.get(id).onsuccess = e => { if (e.target.result) metas.set(id, e.target.result); };
      fs.get(id).onsuccess = e => { if (e.target.result) blobs.set(id, e.target.result); };
    }
    set({ metas, blobs });
  }).then(({ metas, blobs }) => ({
    tracks: book.order.map(id => metas.get(id)).filter(m => m && blobs.has(m.id)),
    blobs
  }));
}

/* ---------- Merkzettel: Stelle pro Hörbuch (localStorage, wird sofort geschrieben) ---------- */
function getPos(bookId) { try { return JSON.parse(localStorage.getItem('pos:' + bookId)); } catch (e) { return null; } }
function setPos(bookId, pos) {
  try { localStorage.setItem('pos:' + bookId, JSON.stringify(pos)); localStorage.setItem('last', String(bookId)); } catch (e) {}
}

/* ---------- Dialoge ---------- */
function modal(build) {
  return new Promise(res => {
    const box = $('modalBox');
    box.textContent = '';
    build(box, v => { $('modal').hidden = true; res(v); });
    $('modal').hidden = false;
  });
}
function info(title, ...body) {
  return modal((box, close) => box.append(h('h2', null, title), ...body.map(b => b.nodeType ? b : h('p', null, b)),
    h('div', { class: 'mbtns' }, h('button', { class: 'pill primary', onclick: () => close() }, 'OK'))));
}
function confirmBox(text, okLabel, danger) {
  return modal((box, close) => box.append(h('p', null, text), h('div', { class: 'mbtns' },
    h('button', { class: 'pill', onclick: () => close(false) }, 'Abbrechen'),
    h('button', { class: 'pill ' + (danger ? 'danger' : 'primary'), onclick: () => close(true) }, okLabel || 'OK'))));
}
function askText(title, def) {
  return modal((box, close) => {
    const inp = h('input', { type: 'text', value: def || '', autocomplete: 'off' });
    const ok = () => { const v = inp.value.trim(); if (v) close(v); };

function busy(title, sub, frac) {

/* ---------- Ansichten ---------- */
let view = 'lib';
function showView(name) {

  $('vLib').hidden = name !== 'lib';
  $('vPlayer').hidden = name !== 'player';

/* ---------- Bibliothek ---------- */
async function renderLib() {
  const list = $('libList');
  let books = [];
  try { books = await dbAll('books'); } catch (e) { list.textContent = ''; list.append(h('div', { class: 'empty' }, 'Der Speicher der App ist nicht erreichbar: ' + e)); return; }
  const at = b => { const p = getPos(b.id); return (p && p.at) || b.created || 0; };
  books.sort((a, b) => at(b) - at(a));
  list.textContent = '';
  if (!books.length) list.append(h('div', { class: 'empty' }, 'Noch kein Hörbuch geladen. Tippe oben auf „Hörbuch hinzufügen“.'));
  for (const b of books) {
    const p = getPos(b.id), n = b.order.length;
    let sub = n + (n === 1 ? ' Datei' : ' Dateien');
    if (p && p.finished) sub += ' · zu Ende gehört';
    else if (p && b.order.indexOf(p.trackId) >= 0) sub += ' · bei Datei ' + (b.order.indexOf(p.trackId) + 1) + ', ' + fmt(p.time);
    else sub += ' · noch nicht begonnen';
    const cov = h('div', { class: 'cov' });
    fillCover(cov, b, false);
    list.append(h('button', { class: 'book' + (P.book && P.book.id === b.id ? ' cur' : ''), onclick: () => openBook(b.id) },
      cov, h('div', { class: 'binfo' }, h('b', null, b.name), h('span', null, sub))));
  }
  renderMini(true);
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(e => { $('libFoot').textContent = fmtSize(e.usage || 0) + ' belegt'; }).catch(() => {});
  }
}
function renderMini(full) {
  const has = !!(P.book && P.index >= 0 && P.tracks[P.index]);
  $('mini').hidden = !has;
  if (!has) return;
  if (full) {
    fillCover($('mCover'), P.book, false);
    $('mTitle').textContent = P.tracks[P.index].name;
    $('mBook').textContent = P.book.name;
  }
  const d = audio.duration;
  $('mProg').style.width = (isFinite(d) && d > 0 ? Math.min(100, curTime() / d * 100) : 0) + '%';
}
$('mini').addEventListener('click', () => { if (P.book) showView(P.tracks.length ? 'player' : 'tracks'); });
$('mPlay').addEventListener('click', e => { e.stopPropagation(); if (audio.paused) play(); else audio.pause(); });

/* ---------- Dateien laden (Import) ---------- */
let pickTarget = null;
function pickFiles(book) { pickTarget = book; $('pick').click(); }
$('pick').addEventListener('change', async e => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (files.length) await importFiles(files, pickTarget);
});

async function importFiles(fileList, book) {
  const files = fileList.filter(isAudio).sort((a, b) => natCmp(a.name, b.name));
  if (!files.length) { await info('Keine Audiodateien', 'In der Auswahl war keine MP3- oder andere Audiodatei.'); return; }
  const isNew = !book;
  if (isNew) {
    const name = await askText('Wie heißt das Hörbuch?', guessName(files));
    if (name === null) return;
    book = { name, created: Date.now(), order: [] };
    book.id = await dbPut('books', book);
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  let lock = null;
  try { if (navigator.wakeLock) lock = await navigator.wakeLock.request('screen'); } catch (e) {}
  let done = 0, err = null;
  for (const f of files) {
    busy('Speichere Datei ' + (done + 1) + ' von ' + files.length, f.name, done / files.length);
    try { await addTrack(book, f); done++; } catch (e) { err = e; break; }
  }
  if (done && !book.cover) {   // Titelbild aus einer der ersten Dateien übernehmen, falls vorhanden
    for (const f of files.slice(0, 3)) {
      const c = await readCover(f);
      if (c) {
        const fresh = await dbGet('books', book.id);
        if (fresh) { fresh.cover = c; await dbPut('books', fresh); book.cover = c; }
        if (P.book && P.book.id === book.id) P.book.cover = c;
        coverUrls.delete(book.id);
        break;
      }
    }
  }
  $('busy').hidden = true;
  if (lock) lock.release().catch(() => {});
  if (err) {
    await info('Nicht alles gespeichert', done + ' von ' + files.length + ' Dateien wurden gespeichert. Danach kam ein Fehler' +
      (err.name === 'QuotaExceededError' ? ': Der Speicherplatz reicht nicht.' : ': ' + (err.message || err.name || err)));
  }
  if (isNew && !done) { await withTx(['books'], 'readwrite', t => { t.objectStore('books').delete(book.id); }); showView('lib'); return; }
  if (P.book && P.book.id === book.id) { P.book.order = book.order; await refreshLoadedBook(); coverShown = null; showView('tracks'); }
  else if (isNew && done) await openBook(book.id);
  else showView('lib');
}

/* ---------- Abspielen ---------- */
const P = { book: null, tracks: [], blobs: new Map(), index: -1, pendingSeek: null, seekTries: 0, seekSince: 0,
  retried: false, token: 0, blockSave: false, srcMem: false };
let rate = parseFloat(localStorage.getItem('rate')) || 1;
let dragging = false, lastSave = 0, editMode = false, coverShown = null;

function setStatus(t) { $('pStatus').textContent = t || ''; }
function applyRate() { try { audio.defaultPlaybackRate = rate; audio.playbackRate = rate; } catch (e) {} }
function curTime() {
  if (P.pendingSeek != null) return Math.max(0, P.pendingSeek);
  if (P.blockSave && P.book) { const p = getPos(P.book.id); if (p && P.tracks[P.index] && p.trackId === P.tracks[P.index].id) return p.time; }
  return audio.currentTime || 0;
}

/* Abspiel-Adressen der Dateien. Safari springt in Dateien direkt aus der App-Datenbank nicht immer an eine Stelle,
   deshalb spielt die App eine frische Kopie im Arbeitsspeicher ab (aktuelle und nächste Datei). */
const urlCache = new Map();   // trackId -> Promise<{url, mem}>
function trackUrl(index, direct) {
  const tr = P.tracks[index];
  if (!tr) return Promise.resolve(null);
  let p = urlCache.get(tr.id);
  if (!p) {
    const blob = P.blobs.get(tr.id);
    p = (direct || blob.size > 250e6) ? Promise.resolve({ url: URL.createObjectURL(blob), mem: false }) : (async () => {
      try {
        const buf = await blob.arrayBuffer();
        return { url: URL.createObjectURL(new Blob([buf], { type: blob.type || 'audio/mpeg' })), mem: true };
      } catch (e) { diag('Kopie fehlgeschlagen: ' + (e.name || e)); return { url: URL.createObjectURL(blob), mem: false }; }
    })();
    urlCache.set(tr.id, p);
  }
  return p;
}
function pruneUrls(all) {
  const keep = all ? new Set() : new Set([P.index, P.index + 1].map(i => P.tracks[i] && P.tracks[i].id));
  for (const [id, p] of urlCache) if (!keep.has(id)) { urlCache.delete(id); p.then(r => { if (r) URL.revokeObjectURL(r.url); }); }
}

function unloadAudio() {
  P.token++;
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  P.index = -1; P.pendingSeek = null; P.blockSave = false;
  pruneUrls(true);
}

async function openBook(id) {
  if (P.book && P.book.id === id) { showView(P.tracks.length ? 'player' : 'tracks'); return; }
  const book = await dbGet('books', id);
  if (!book) { showView('lib'); return; }
  const data = await loadBookData(book);
  if (P.book) { savePos(true); unloadAudio(); }
  P.book = book; P.tracks = data.tracks; P.blobs = data.blobs; editMode = false; coverShown = null;
  setStatus('');
  if (!P.tracks.length) { editMode = true; showView('tracks'); return; }
  const pos = getPos(id);
  let idx = 0, t = 0;
  if (pos) { const i = P.tracks.findIndex(x => x.id === pos.trackId); if (i >= 0) { idx = i; t = pos.time || 0; } }
  loadTrack(idx, t, false, pos && pos.finished);
  if (pos && pos.finished) setStatus('Dieses Hörbuch hast du zu Ende gehört.');
  showView('player');
}

async function refreshLoadedBook() {
  const curId = currentTrackId();
  const data = await loadBookData(P.book);
  P.tracks = data.tracks; P.blobs = data.blobs;
  const i = P.tracks.findIndex(x => x.id === curId);
  if (i >= 0) { P.index = i; updateMeta(); }
  else if (P.tracks.length) loadTrack(0, 0, false);
  else unloadAudio();
}

/* time: Sekunden ab Anfang; negativ = Sekunden vor dem Ende der Datei */
/* direct: ohne Kopie (beim automatischen Weiterschalten, falls die nächste Datei nicht vorbereitet ist) */
async function loadTrack(index, time, autoplay, keepFinished, direct) {
  const tr = P.tracks[index];
  if (!tr) return;
  const token = ++P.token;
  P.index = index;
  P.pendingSeek = (time > 0.5 || time < 0) ? time : null;
  P.seekTries = 0; P.seekSince = Date.now(); P.blockSave = false;
  if (time >= 0) {
    const pos = { trackId: tr.id, time: time, at: Date.now() };
    if (keepFinished) pos.finished = true;
    setPos(P.book.id, pos);
  }
  updateMeta();
  renderPlayer();
  if (view === 'tracks') renderTracks();
  const src = await trackUrl(index, direct);
  if (token !== P.token || !src) return;
  P.srcMem = src.mem;
  // Startstelle gleich in der Adresse mitgeben („#t=“); Safari beginnt dann dort, auch ohne späteren Sprung
  audio.src = src.url + (time > 0.5 ? '#t=' + time.toFixed(2) : '');
  applyRate();
  diag('Datei ' + (index + 1) + ' geladen, Start ' + fmt(Math.max(0, time)) + (src.mem ? ' (Kopie)' : ' (direkt)'));
  pruneUrls();
  const nx = P.tracks[index + 1];
  if (nx && (P.blobs.get(nx.id) || {}).size < 100e6) trackUrl(index + 1);
  if (autoplay) play();
}

function play() {
  if (P.index < 0) return;
  if (P.blockSave) {   // nach einem gescheiterten Sprung: erneut versuchen, an die gemerkte Stelle zu kommen
    const pos = getPos(P.book.id);
    if (pos && pos.trackId === P.tracks[P.index].id && pos.time > 0.5) { P.pendingSeek = pos.time; P.seekTries = 0; }
    P.blockSave = false;
  }
  P.seekSince = Date.now();
  applyRate();
  const p = audio.play();
  if (p && p.catch) p.catch(err => {
    if (err && err.name === 'AbortError') return;
    setStatus(err && err.name === 'NotAllowedError' ? 'Bitte auf ▶ tippen.' : 'Wiedergabe gerade nicht möglich. Bitte noch einmal auf ▶ tippen.');
    renderPlayState();
  });
}

/* Bringt die Wiedergabe an P.pendingSeek. Gibt nach mehreren Versuchen auf, statt die Anzeige einzufrieren;
   dann hält sie an und lässt die gemerkte Stelle unangetastet. */
function applySeek() {
  if (P.pendingSeek == null) return;
  const d = audio.duration;
  if (!(d > 0)) return;
  let t = P.pendingSeek;
  if (t < 0) t = isFinite(d) ? Math.max(0, d + t) : 0;
  else if (isFinite(d)) t = Math.min(t, Math.max(0, d - 1));
  P.pendingSeek = t;
  if (Math.abs(audio.currentTime - t) <= 1.5) {
    P.pendingSeek = null; diag('Stelle ' + fmt(t) + ' erreicht'); savePos(true); renderTime(); updatePositionState(); return;
  }
  const waited = Date.now() - P.seekSince;
  if (audio.seeking && waited < 4000) return;
  if (P.seekTries >= 6 || (!audio.paused && waited > 8000)) { giveUpSeek(t); return; }
  P.seekTries++;
  try { audio.currentTime = t; } catch (e) { diag('Sprung-Fehler: ' + (e.name || e)); }
  diag('springe zu ' + fmt(t) + ' (Versuch ' + P.seekTries + ')');
}
function giveUpSeek(t) {
  P.pendingSeek = null;
  P.blockSave = true;   // falsche Stelle nicht als „gemerkt“ speichern
  audio.pause();
  diag('Sprung aufgegeben: ' + fmt(t));
  setStatus('Das iPhone konnte nicht zu ' + fmt(t) + ' springen. Die gemerkte Stelle bleibt gespeichert – bitte noch einmal auf ▶ tippen.');
  renderTime(); renderPlayState();
}

function savePos(force) {
  if (!P.book || P.index < 0 || P.pendingSeek != null || P.blockSave) return;
  const now = Date.now();
  if (!force && now - lastSave < 3000) return;
  lastSave = now;
  const pos = { trackId: P.tracks[P.index].id, time: audio.currentTime || 0, at: now };
  const prev = getPos(P.book.id);   // „zu Ende gehört" bleibt stehen, bis wirklich wieder gehört wird
  if (prev && prev.finished && prev.trackId === pos.trackId && pos.time < 1) { pos.finished = true; pos.at = prev.at; }
  setPos(P.book.id, pos);
}

function seekTo(t) {
  if (P.index < 0) return;
  const d = audio.duration;
  if (isFinite(d) && d > 0) t = Math.min(t, Math.max(0, d - 0.3));
  t = Math.max(0, t);
  P.blockSave = false;
  setPos(P.book.id, { trackId: P.tracks[P.index].id, time: t, at: Date.now() });
  P.pendingSeek = t; P.seekTries = 0; P.seekSince = Date.now();
  if (audio.readyState >= 1) { P.seekTries = 1; try { audio.currentTime = t; } catch (e) {} }
  diag('Sprung gewünscht: ' + fmt(t));
  renderTime(); updatePositionState();
}
function seekRel(delta) {
  if (P.index < 0) return;
  const base = curTime();
  if (delta < 0 && base <= 1 && P.index > 0) { loadTrack(P.index - 1, delta, !audio.paused); return; }
  seekTo(base + delta);
}
function prevTrack() {
  if (P.index < 0) return;
  const playing = !audio.paused;
  if (curTime() > 5 || P.index === 0) seekTo(0); else loadTrack(P.index - 1, 0, playing);
}
function nextTrack() {
  if (P.index < 0 || P.index + 1 >= P.tracks.length) return;
  loadTrack(P.index + 1, 0, !audio.paused);
}

audio.addEventListener('loadedmetadata', () => { applyRate(); applySeek(); renderTime(); updatePositionState(); });
audio.addEventListener('canplay', applySeek);
audio.addEventListener('seeked', () => { applySeek(); savePos(true); renderTime(); updatePositionState(); });
audio.addEventListener('timeupdate', () => { if (P.pendingSeek != null) applySeek(); else savePos(false); renderTime(); });
audio.addEventListener('playing', () => { P.retried = false; setStatus(''); applySeek(); renderPlayState(); updatePositionState(); });
audio.addEventListener('play', renderPlayState);
audio.addEventListener('pause', () => { savePos(true); renderPlayState(); updatePositionState(); });
audio.addEventListener('ratechange', updatePositionState);
audio.addEventListener('ended', () => {
  if (P.index + 1 < P.tracks.length) { loadTrack(P.index + 1, 0, true, false, true); return; }
  loadTrack(0, 0, false, true);
  setStatus('Hörbuch zu Ende gehört.');
  renderPlayState();
});
audio.addEventListener('error', () => {
  if (P.index < 0 || !audio.getAttribute('src')) return;
  if (!P.retried) {           // einmal neu laden, an der gemerkten Stelle
    P.retried = true;
    const pos = getPos(P.book.id);
    loadTrack(P.index, pos && pos.trackId === P.tracks[P.index].id ? pos.time : 0, false);
    return;
  }
  setStatus('Diese Datei lässt sich nicht abspielen.');
  renderPlayState();
});
if (DIAG) {
  for (const ev of ['loadstart', 'loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough', 'play', 'playing', 'pause',
    'waiting', 'stalled', 'seeking', 'seeked', 'ended', 'error', 'emptied', 'abort'])
    audio.addEventListener(ev, () => diag(ev + (ev === 'error' && audio.error ? ' ' + audio.error.code + ' ' + (audio.error.message || '') : '')));
  audio.addEventListener('timeupdate', renderDiag);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) savePos(true); else { renderTime(); renderPlayState(); } });
window.addEventListener('pagehide', () => savePos(true));

/* ---------- Sperrbildschirm / Kopfhörer-Tasten ---------- */
function updateMeta() {
  if (!('mediaSession' in navigator) || P.index < 0 || !window.MediaMetadata) return;
  const u = coverUrl(P.book);
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: P.tracks[P.index].name, artist: P.book.name,
      album: 'Datei ' + (P.index + 1) + ' von ' + P.tracks.length,
      artwork: u ? [{ src: u, sizes: '512x512', type: P.book.cover.type || 'image/jpeg' }] : [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
    });
  } catch (e) {}
}
function updatePositionState() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  const d = audio.duration;
  if (!isFinite(d) || !(d > 0)) return;
  try { navigator.mediaSession.setPositionState({ duration: d, playbackRate: audio.playbackRate || 1, position: Math.min(curTime(), d) }); } catch (e) {}
}
if ('mediaSession' in navigator) {
  const set = (name, fn) => { try { navigator.mediaSession.setActionHandler(name, fn); } catch (e) {} };
  set('play', play);
  set('pause', () => audio.pause());
  set('seekbackward', d => seekRel(-((d && d.seekOffset) || 10)));
  set('seekforward', d => seekRel((d && d.seekOffset) || 10));
  set('seekto', d => { if (d && d.seekTime != null) seekTo(d.seekTime); });
}

/* ---------- Player-Anzeige ---------- */
function renderPlayer() {
  if (!P.book) return;
  if (coverShown !== P.book.id) { fillCover($('pCover'), P.book, true); coverShown = P.book.id; }
  const tr = P.tracks[P.index];
  $('pTitle').textContent = tr ? tr.name : '';
  $('pSub').textContent = P.book.name + (tr ? ' · Datei ' + (P.index + 1) + ' von ' + P.tracks.length : '');
  $('bRate').textContent = String(rate).replace('.', ',') + '×';
  renderTime(); renderPlayState();
  if (view === 'lib') renderMini(true);
}
function renderTime() {
  const d = audio.duration, t = curTime(), ok = isFinite(d) && d > 0;
  const s = $('seek');
  if (!dragging) {
    s.max = ok ? Math.floor(d) : 1;
    s.value = ok ? Math.floor(t) : 0;
    $('tCur').textContent = fmt(t);
  }
  s.style.setProperty('--pct', (ok ? Math.min(100, (+s.value) / Math.max(1, +s.max) * 100) : 0) + '%');
  $('tRem').textContent = ok ? '-' + fmt(d - t) : '';
  if (view === 'lib') renderMini(false);
}
function renderPlayState() {
  const playing = !audio.paused && !audio.ended && P.index >= 0;
  $('pIcon').setAttribute('d', playing ? ICON_PAUSE : ICON_PLAY);
  $('mIcon').setAttribute('d', playing ? ICON_PAUSE : ICON_PLAY);
  $('bPlay').setAttribute('aria-label', playing ? 'Pause' : 'Abspielen');
  $('mPlay').setAttribute('aria-label', playing ? 'Pause' : 'Abspielen');
}

$('bPlay').addEventListener('click', () => { if (audio.paused) play(); else audio.pause(); });
$('bBack10').addEventListener('click', () => seekRel(-10));
$('bFwd10').addEventListener('click', () => seekRel(10));
$('bPrev').addEventListener('click', prevTrack);
$('bNext').addEventListener('click', nextTrack);
$('bRate').addEventListener('click', () => {
  rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
  try { localStorage.setItem('rate', String(rate)); } catch (e) {}
  applyRate(); renderPlayer();
});
$('seek').addEventListener('input', () => {
  dragging = true;
  const s = $('seek');
  $('tCur').textContent = fmt(+s.value);
  s.style.setProperty('--pct', (+s.value) / Math.max(1, +s.max) * 100 + '%');
});
$('seek').addEventListener('change', () => { dragging = false; seekTo(+$('seek').value); });
$('bBack').addEventListener('click', () => { savePos(true); showView('lib'); });
$('bList').addEventListener('click', () => { editMode = false; showView('tracks'); });

/* ---------- Dateiliste und Reihenfolge ---------- */
function renderTracks() {
  if (!P.book) return;
  $('tBook').textContent = P.book.name;
  $('bEdit').textContent = editMode ? 'Fertig' : 'Bearbeiten';
  $('tTools').hidden = !editMode;
  const list = $('tList');
  list.textContent = '';
  if (!P.tracks.length) list.append(h('div', { class: 'empty' }, 'Dieses Hörbuch enthält noch keine Dateien.'));
  P.tracks.forEach((tr, i) => {
    list.append(h('div', { class: 'trow' + (i === P.index ? ' cur' : '') },
      h('button', { class: 'tmain', onclick: () => jumpTo(i) }, h('span', { class: 'tnum' }, i + 1), h('span', { class: 'tname' }, tr.name)),
      editMode && h('div', { class: 'tedit' },
        h('button', { 'aria-label': 'nach oben', disabled: i === 0, onclick: () => moveTrack(i, -1) }, '↑'),
        h('button', { 'aria-label': 'nach unten', disabled: i === P.tracks.length - 1, onclick: () => moveTrack(i, 1) }, '↓'),
        h('button', { class: 'del', 'aria-label': 'löschen', onclick: () => deleteTrack(i) }, '✕'))));
  });
  const cur = list.querySelector('.cur');
  if (cur && !editMode) cur.scrollIntoView({ block: 'center' });
}
async function jumpTo(i) {
  if (editMode) return;
  if (i === P.index) { showView('player'); return; }
  const ok = await confirmBox('Zu „' + P.tracks[i].name + '“ springen? Die gemerkte Stelle wird dann durch diese Datei ersetzt.', 'Springen');
  if (!ok) return;
  loadTrack(i, 0, true);
  showView('player');
}
function currentTrackId() { return P.index >= 0 && P.tracks[P.index] ? P.tracks[P.index].id : null; }
async function persistOrder(curId) {
  P.book.order = P.tracks.map(t => t.id);
  P.index = P.tracks.findIndex(t => t.id === curId);
  await dbPut('books', P.book);
  updateMeta(); renderTracks();
}
async function moveTrack(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= P.tracks.length) return;
  const curId = currentTrackId();
  const tmp = P.tracks[i]; P.tracks[i] = P.tracks[j]; P.tracks[j] = tmp;
  await persistOrder(curId);
}
async function sortTracks() {
  const curId = currentTrackId();
  P.tracks.sort((a, b) => natCmp(a.name, b.name));
  await persistOrder(curId);
}
async function deleteTrack(i) {
  const tr = P.tracks[i];
  if (!await confirmBox('„' + tr.name + '“ aus diesem Hörbuch löschen?', 'Löschen', true)) return;
  const wasCur = i === P.index, curId = currentTrackId();
  if (wasCur) unloadAudio();
  P.tracks.splice(i, 1);
  P.blobs.delete(tr.id);
  P.book.order = P.tracks.map(t => t.id);
  await withTx(['tracks', 'files', 'books'], 'readwrite', t => {
    t.objectStore('tracks').delete(tr.id); t.objectStore('files').delete(tr.id); t.objectStore('books').put(P.book);
  });
  if (wasCur) { if (P.tracks.length) loadTrack(Math.min(i, P.tracks.length - 1), 0, false); }
  else P.index = P.tracks.findIndex(t => t.id === curId);
  updateMeta(); renderTracks();
}
async function deleteBook() {
  const b = P.book;
  if (!await confirmBox('Das Hörbuch „' + b.name + '“ mit allen Dateien vom iPhone löschen?', 'Löschen', true)) return;
  unloadAudio();
  P.book = null; P.tracks = []; P.blobs = new Map(); coverShown = null;
  await withTx(['tracks', 'files', 'books'], 'readwrite', t => {
    const ts = t.objectStore('tracks'), fs = t.objectStore('files');
    ts.index('bookId').getAllKeys(b.id).onsuccess = e => { for (const k of e.target.result) { ts.delete(k); fs.delete(k); } };
    for (const k of b.order) fs.delete(k);
    t.objectStore('books').delete(b.id);
  });
  if (coverUrls.has(b.id)) { URL.revokeObjectURL(coverUrls.get(b.id)); coverUrls.delete(b.id); }
  try { localStorage.removeItem('pos:' + b.id); if (localStorage.getItem('last') === String(b.id)) localStorage.removeItem('last'); } catch (e) {}
  showView('lib');
}
$('bTBack').addEventListener('click', () => { editMode = false; showView(P.tracks.length ? 'player' : 'lib'); });
$('bEdit').addEventListener('click', () => { editMode = !editMode; renderTracks(); });
$('bSort').addEventListener('click', sortTracks);
$('bAddFiles').addEventListener('click', () => pickFiles(P.book));
$('bRename').addEventListener('click', async () => {
  const name = await askText('Neuer Name', P.book.name);
  if (name === null) return;
  P.book.name = name;
  await dbPut('books', P.book);
  coverShown = null;
  updateMeta(); renderTracks();
});
$('bDelBook').addEventListener('click', deleteBook);

/* ---------- Bibliothek: Knöpfe, Hilfe ---------- */
$('bAdd').addEventListener('click', () => pickFiles(null));
$('bHelp').addEventListener('click', () => info('So kommen Hörbücher aufs iPhone',
  h('ol', null,
    h('li', null, 'Am Mac die MP3-Dateien des Hörbuchs in einen Ordner in pCloud legen (oder per AirDrop ans iPhone schicken und dort „In Dateien sichern“ wählen).'),
    h('li', null, 'Hier auf „Hörbuch hinzufügen“ tippen. Es öffnet sich die Dateiauswahl des iPhones.'),
    h('li', null, 'Den Ordner öffnen, oben rechts auf „Auswählen“ tippen, alle Dateien markieren, dann „Öffnen“.'),
    h('li', null, 'Namen bestätigen. Die Dateien werden in die App kopiert und sind danach ohne Internet abspielbar.')),
  'Die Reihenfolge richtet sich nach den Dateinamen (01, 02, 03 …). Unter „Dateien“ → „Bearbeiten“ kannst du sie ändern.',
  'Die farbigen Punkte unten auf der Startseite wechseln das Farbthema.'));

/* ---------- Start ---------- */
(async function start() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (ios && !standalone) $('installBanner').hidden = false;
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  const last = parseInt(localStorage.getItem('last'), 10);
  try { if (last) { await openBook(last); return; } } catch (e) {}
  showView('lib');
})();
</script>
</body>
